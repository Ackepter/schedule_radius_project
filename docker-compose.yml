services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-children}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-children_password}
      POSTGRES_DB: ${POSTGRES_DB:-children_center}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-children} -d ${POSTGRES_DB:-children_center}"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      DATABASE_URL: "postgresql+psycopg2://${POSTGRES_USER:-children}:${POSTGRES_PASSWORD:-children_password}@postgres:5432/${POSTGRES_DB:-children_center}"
      CORS_ORIGINS: "http://localhost:8080,http://localhost"
      SEED_ON_STARTUP: "${SEED_ON_STARTUP:-false}"
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8000:8000"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "8080:80"

volumes:
  pgdata:
